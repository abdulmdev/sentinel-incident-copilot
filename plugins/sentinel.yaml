apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: sentinel
spec:
  version: v2.0.0-alpha.3
  homepage: https://github.com/abdulmdev/sentinel-incident-copilot
  shortDescription: Approve AI agent actions guarded by Sentinel Guard
  description: |
    Sentinel Guard stops AI agents from changing your cluster unless policy, or a human,
    approved that exact change, and then admits it once. This plugin lists pending agent
    actions, approves or denies them with your own Kubernetes credentials, and verifies
    the guard's signed, hash-chained audit trail.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/abdulmdev/sentinel-incident-copilot/releases/download/v2.0.0-alpha.3/kubectl-sentinel_linux_amd64.tar.gz
      sha256: 4cb746cf7bba5f0154bb3cced60e5bd17f0c59c0bf827f48041d1fe685ec4fef
      files:
        - from: kubectl-sentinel
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-sentinel
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/abdulmdev/sentinel-incident-copilot/releases/download/v2.0.0-alpha.3/kubectl-sentinel_linux_arm64.tar.gz
      sha256: ad0b400d9242e4938c1b1178d8c0ebd2ed34554ebcaa07fa7a9a559aa3880056
      files:
        - from: kubectl-sentinel
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-sentinel
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/abdulmdev/sentinel-incident-copilot/releases/download/v2.0.0-alpha.3/kubectl-sentinel_darwin_amd64.tar.gz
      sha256: 7753ed91d597e8ade85dc1bdb6549234785cbbaa86c45cca35870ea3c4a1ac80
      files:
        - from: kubectl-sentinel
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-sentinel
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/abdulmdev/sentinel-incident-copilot/releases/download/v2.0.0-alpha.3/kubectl-sentinel_darwin_arm64.tar.gz
      sha256: 2df41eda4cf899d93c9d99f54ac899770bf9b3118a2012768de1c6abb1a901e0
      files:
        - from: kubectl-sentinel
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-sentinel
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/abdulmdev/sentinel-incident-copilot/releases/download/v2.0.0-alpha.3/kubectl-sentinel_windows_amd64.tar.gz
      sha256: 35ad1cecf946316a19b3682175eba7fdb2175b5ea0e620025c472497f4a4cbbe
      files:
        - from: kubectl-sentinel.exe
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-sentinel.exe
