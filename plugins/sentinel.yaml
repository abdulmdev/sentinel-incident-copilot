apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: sentinel
spec:
  version: v2.0.0-alpha.2
  homepage: https://github.com/abdulmdev/sentinel-incident-copilot
  shortDescription: Approve AI agent actions guarded by Sentinel Guard
  description: |
    Sentinel Guard stops AI agents from changing your cluster unless policy, or a human,
    approved that exact change, and then admits it once. This plugin lists pending agent
    actions, approves or denies them with your own Kubernetes credentials, and verifies
    the guard's signed, hash-chained audit trail.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/abdulmdev/sentinel-incident-copilot/releases/download/v2.0.0-alpha.2/kubectl-sentinel_linux_amd64.tar.gz
      sha256: 1db87411b15ec2afe4b0b66357cde9ab2932d76eefaf61ffc86e92e5cd7c42bb
      files:
        - from: kubectl-sentinel
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-sentinel
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/abdulmdev/sentinel-incident-copilot/releases/download/v2.0.0-alpha.2/kubectl-sentinel_linux_arm64.tar.gz
      sha256: 04a74c22ce0e0c5a60174a318f3b1ecbafc13dc70bc8d3a23d708fbc1234e338
      files:
        - from: kubectl-sentinel
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-sentinel
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/abdulmdev/sentinel-incident-copilot/releases/download/v2.0.0-alpha.2/kubectl-sentinel_darwin_amd64.tar.gz
      sha256: 0e9df76aae1042a07f1b43ad1bb58ad8fce542ed8cf545d8df33ae14c3271e84
      files:
        - from: kubectl-sentinel
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-sentinel
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/abdulmdev/sentinel-incident-copilot/releases/download/v2.0.0-alpha.2/kubectl-sentinel_darwin_arm64.tar.gz
      sha256: 4bb119952284277f9e6c604408bc4357a770c99d4605e97e6b0a1ad8938b4a96
      files:
        - from: kubectl-sentinel
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-sentinel
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/abdulmdev/sentinel-incident-copilot/releases/download/v2.0.0-alpha.2/kubectl-sentinel_windows_amd64.tar.gz
      sha256: 988991e547e1c82b525fb43e1a2d68f6cebeeb019a2541cde0afe27628ff2d06
      files:
        - from: kubectl-sentinel.exe
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-sentinel.exe
