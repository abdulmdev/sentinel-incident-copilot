apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: sentinel
spec:
  version: v2.0.0
  homepage: https://github.com/abdulmdev/sentinel-incident-copilot
  shortDescription: Approve AI agent actions guarded by Sentinel Guard
  description: |
    Sentinel Guard stops AI agents from changing your cluster unless policy, or a human,
    approved that exact change, and then admits it once. This plugin lists pending agent
    actions, approves or denies them with your own Kubernetes credentials, and verifies
    the guard's signed, hash-chained audit trail.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/abdulmdev/sentinel-incident-copilot/releases/download/v2.0.0/kubectl-sentinel_linux_amd64.tar.gz
      sha256: c7db9f008296e6a6c03457d8f2ea38e596ea201e4f13c56f575f1f98740c6c65
      files:
        - from: kubectl-sentinel
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-sentinel
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/abdulmdev/sentinel-incident-copilot/releases/download/v2.0.0/kubectl-sentinel_linux_arm64.tar.gz
      sha256: b817e4b5129dfe5627b6693ab165a5b47d8bdf2ee1ac642f44f26c62a3eb0693
      files:
        - from: kubectl-sentinel
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-sentinel
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/abdulmdev/sentinel-incident-copilot/releases/download/v2.0.0/kubectl-sentinel_darwin_amd64.tar.gz
      sha256: abae565027914cb3f0f0a833079aab083d8fd641c172ec8eb19c260f7706a862
      files:
        - from: kubectl-sentinel
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-sentinel
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/abdulmdev/sentinel-incident-copilot/releases/download/v2.0.0/kubectl-sentinel_darwin_arm64.tar.gz
      sha256: 4b3b2949ea64167f40eac1ba47e90ad74dfb157796ba03cfc92dabf3334110e9
      files:
        - from: kubectl-sentinel
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-sentinel
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/abdulmdev/sentinel-incident-copilot/releases/download/v2.0.0/kubectl-sentinel_windows_amd64.tar.gz
      sha256: 316f5b58ff16816b817f4d547b8bf794b1c545ac26d954833502761b43905e92
      files:
        - from: kubectl-sentinel.exe
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-sentinel.exe
