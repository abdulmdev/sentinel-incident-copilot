# Sentinel Guard in one command: the guard, and a support-desk agent working behind it.
#
#   docker compose up                       # then open http://localhost:8080 (token: alice-demo)
#   docker compose --profile monitoring up  # also Prometheus (alerts) and Grafana on :3000
#
# Two approvers, each with their own token (alice-demo, bob-demo): closing an account needs both.
# The tokens below are for trying it on your machine. Ports are bound to localhost only.
# The incident-response copilot's full stack is a different compose file: deploy/docker-compose.yml.
name: sentinel-guard-quickstart

services:
  guard:
    build: { context: guard, args: { VERSION: quickstart } }
    image: sentinel-guard:quickstart
    environment:
      SENTINEL_GUARD_MODE: memory
      SENTINEL_GUARD_POLICY: /etc/sentinel-guard/policy.yaml
      SENTINEL_GUARD_AGENT_TOKENS: refund-bot=${AGENT_TOKEN:-agent-demo-token}
      SENTINEL_GUARD_APPROVER_TOKENS: alice@example.com=${ALICE_TOKEN:-alice-demo},bob@example.com=${BOB_TOKEN:-bob-demo}
      SENTINEL_GUARD_VERIFY_INTERVAL: 30s
      SENTINEL_GUARD_NOTIFY_URL: http://notifications:8000/
      SENTINEL_GUARD_PUBLIC_URL: http://localhost:${GUARD_PORT:-8080}
    volumes:
      - ./examples/quickstart/policy.yaml:/etc/sentinel-guard/policy.yaml:ro
    ports:
      - "127.0.0.1:${GUARD_PORT:-8080}:8080"
    depends_on: [notifications]
    healthcheck:
      test: ["CMD", "/sentinel-guard", "-healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 30

  notifications:
    # Stands in for Slack: prints what the guard would post (docker compose logs -f notifications).
    image: python:3.13-slim
    command: ["python", "-u", "/app/notify_sink.py"]
    volumes:
      - ./examples/quickstart/notify_sink.py:/app/notify_sink.py:ro
    user: "65532:65532"

  agent:
    build: { context: ., dockerfile: examples/quickstart/agent.Dockerfile }
    image: sentinel-guard-demo-agent:quickstart
    depends_on:
      guard: { condition: service_healthy }
    environment:
      SENTINEL_GUARD_URL: http://guard:8080
      SENTINEL_GUARD_TOKEN: ${AGENT_TOKEN:-agent-demo-token}
      INBOX_URL: http://localhost:${GUARD_PORT:-8080}
      TICKET_EVERY: ${TICKET_EVERY:-20}
    restart: unless-stopped

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    depends_on: [guard]
    volumes:
      - ./examples/quickstart/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/helm/sentinel-guard/alerts/guard-alerts.yaml:/etc/prometheus/rules/guard-alerts.yaml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.0
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sentinel-guard.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./examples/quickstart/grafana/provisioning.yaml:/etc/grafana/provisioning/datasources/sentinel-guard.yaml:ro
      - ./examples/quickstart/grafana/provisioning.yaml:/etc/grafana/provisioning/dashboards/sentinel-guard.yaml:ro
      - ./deploy/helm/sentinel-guard/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
