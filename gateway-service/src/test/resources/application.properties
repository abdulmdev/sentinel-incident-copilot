# Tests use a deterministic fake embedding model (TestEmbeddingConfig): no ONNX model download.
spring.ai.model.embedding=none
spring.ai.anthropic.api-key=test
# Only *IT tests have a database; they turn Flyway back on.
spring.flyway.enabled=false
# Unit tests use the in-memory limiter; RedisRateLimiterIT covers Redis.
sentinel.rate-limit.backend=memory
