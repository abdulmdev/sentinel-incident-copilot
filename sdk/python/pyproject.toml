[project]
name = "sentinel-guard"
version = "2.0.0a3"
description = "Python SDK for Sentinel Guard: ask before acting, get a single-use capability once a human approves, redeem it once."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28"]
keywords = ["ai-agents", "guardrails", "human-in-the-loop", "approvals", "mcp", "langchain", "langgraph"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
mcp = ["mcp>=1.20,<2", "pyyaml>=6"]

[project.scripts]
sentinel-guard-mcp-proxy = "sentinel_guard.mcp_proxy:main"

[project.urls]
Homepage = "https://github.com/abdulmdev/sentinel-incident-copilot"
Documentation = "https://github.com/abdulmdev/sentinel-incident-copilot/blob/main/docs/guard/sdk.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "langchain-core>=0.3", "mcp>=1.20,<2", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.sdist]
include = ["sentinel_guard", "tests", "README.md"]
