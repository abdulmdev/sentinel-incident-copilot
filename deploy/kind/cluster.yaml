# Local Kubernetes for the Helm chart: scripts/kind-up.sh
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sentinel
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30300, hostPort: 13000 }   # console (NodePort)
      - { containerPort: 30080, hostPort: 18080 }   # gateway API (NodePort)
