# Prometheus + Grafana for scripts/dev-local.sh (services on the host). Same project network as the main file.
services:
  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./prometheus/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sentinel.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./alertmanager/alertmanager-local.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-token:/etc/alertmanager/token:ro
    ports: ["9093:9093"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      alertmanager-token: { condition: service_completed_successfully }
  alertmanager-token:   # one-shot: asks the gateway (as a dev tenant admin) for an integration token
    image: python:3.12-slim
    environment:
      SENTINEL_JWT_SECRET: ${SENTINEL_JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
    volumes:
      - ../scripts:/scripts:ro
      - alertmanager-token:/out
    command: ["python", "/scripts/integration_token.py", "http://host.docker.internal:8080", "${SENTINEL_ALERT_TENANT:-acme}", "/out/integration.jwt"]
    extra_hosts: ["host.docker.internal:host-gateway"]
volumes:
  alertmanager-token:
