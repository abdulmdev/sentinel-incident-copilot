# For scripts/dev-local.sh: services run on the host, Prometheus in Docker.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:8080"] }]
  - job_name: ingestion
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:8090"] }]
  - job_name: agent
    static_configs: [{ targets: ["host.docker.internal:8000"] }]
  - job_name: chaos-lab
    static_configs: [{ targets: ["host.docker.internal:8101", "host.docker.internal:8102"] }]
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
