global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["gateway:8080"] }]
  - job_name: agent
    static_configs: [{ targets: ["agent:8000"] }]
  - job_name: chaos-lab
    static_configs: [{ targets: ["checkout:8000", "inventory:8000"] }]
  - job_name: ingestion
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["ingestion:8090"] }]
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
