apiVersion: v2
name: sentinel-guard
description: >-
  Envelope protection for AI agents on Kubernetes. No agent changes your cluster unless policy,
  or a human, approved that exact change, and then only once. Humans, CI and controllers are
  never affected.
type: application
version: 2.0.0-alpha.2
appVersion: 2.0.0-alpha.2
kubeVersion: ">=1.30.0-0"
home: https://abdulmdev.github.io/sentinel-incident-copilot/
sources:
  - https://github.com/abdulmdev/sentinel-incident-copilot
keywords: [ai-agents, guardrails, admission-webhook, policy, approvals, audit, llm, mcp, security]
maintainers:
  - name: abdulmdev
    url: https://github.com/abdulmdev
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "true"
  artifacthub.io/category: security
  artifacthub.io/crds: |
    - kind: ActionRequest
      version: v1alpha1
      name: actionrequests.sentinel.dev
      displayName: ActionRequest
      description: An action an AI agent proposed, its approval and its audit trail.
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/abdulmdev/sentinel-incident-copilot/blob/main/docs/guard/README.md
