apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-guard
  namespace: {{ .Release.Namespace }}
  labels: {{- include "guard.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-guard-policy
  namespace: {{ .Release.Namespace }}
  labels: {{- include "guard.labels" . | nindent 4 }}
data:
  policy.yaml: |
    {{- include "guard.policy" . | nindent 4 }}
