{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinel-guard
  namespace: {{ .Release.Namespace }}
  labels: {{- include "guard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "guard.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # The API server's source address differs by distribution, so the webhook port is open to
    # any source; every caller still needs a valid admission review or token.
    - ports: [{port: 8443}]
    - ports: [{port: 9090}]
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sentinel-guard
  namespace: {{ .Release.Namespace }}
  labels: {{- include "guard.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "guard.selector" . | nindent 6 }}
  endpoints:
    - port: metrics
{{- end }}
