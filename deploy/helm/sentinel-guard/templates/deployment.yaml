apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-guard
  namespace: {{ .Release.Namespace }}
  labels: {{- include "guard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "guard.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "guard.selector" . | nindent 8 }}
      annotations:
        checksum/policy: {{ include "guard.policy" . | sha256sum }}
    spec:
      serviceAccountName: sentinel-guard
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      # Spread replicas so one node or zone failure leaves the guard answering.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "guard.selector" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "guard.selector" . | nindent 14 }}
      containers:
        - name: guard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [--mode=kubernetes]
          env:
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: SERVICE_ACCOUNT, value: sentinel-guard}
            - {name: SENTINEL_GUARD_POLICY, value: /etc/sentinel-guard/policy.yaml}
            - {name: SENTINEL_GUARD_SERVICE, value: sentinel-guard}
            - {name: SENTINEL_GUARD_VALIDATING_WEBHOOK, value: sentinel-guard}
            - {name: SENTINEL_GUARD_MUTATING_WEBHOOK, value: sentinel-guard}
            {{- if .Values.api.plainHTTP }}
            - {name: SENTINEL_GUARD_API_ADDR, value: ":{{ .Values.api.port }}"}
            {{- end }}
            {{- with .Values.oidc }}
            {{- if .issuer }}
            - {name: SENTINEL_GUARD_OIDC_ISSUER, value: {{ .issuer | quote }}}
            - {name: SENTINEL_GUARD_OIDC_AUDIENCE, value: {{ required "oidc.audience is required with oidc.issuer" .audience | quote }}}
            {{- with .usernameClaim }}
            - {name: SENTINEL_GUARD_OIDC_USERNAME_CLAIM, value: {{ . | quote }}}
            {{- end }}
            {{- with .groupsClaim }}
            - {name: SENTINEL_GUARD_OIDC_GROUPS_CLAIM, value: {{ . | quote }}}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.notify }}
            {{- if .existingSecret }}
            - name: SENTINEL_GUARD_NOTIFY_URL
              valueFrom: {secretKeyRef: {name: {{ .existingSecret | quote }}, key: {{ .key | default "url" | quote }}}}
            {{- else if .url }}
            - {name: SENTINEL_GUARD_NOTIFY_URL, value: {{ .url | quote }}}
            {{- end }}
            {{- with .publicURL }}
            - {name: SENTINEL_GUARD_PUBLIC_URL, value: {{ . | quote }}}
            {{- end }}
            {{- end }}
          ports:
            - {name: https, containerPort: 8443}
            - {name: metrics, containerPort: 9090}
            {{- if .Values.api.plainHTTP }}
            - {name: http, containerPort: {{ .Values.api.port }}}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: https, scheme: HTTPS}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # Keep answering while this pod is removed from the Service's endpoints: the API server
            # calls the webhooks through it, and a call sent to a pod that already stopped would hang
            # until the webhook timeout (seen right after a rolling restart).
            preStop: {sleep: {seconds: 5}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: policy, mountPath: /etc/sentinel-guard, readOnly: true}
      volumes:
        - name: policy
          configMap: {name: sentinel-guard-policy}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinel-guard
  namespace: {{ .Release.Namespace }}
  labels: {{- include "guard.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {{- include "guard.selector" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-guard
  namespace: {{ .Release.Namespace }}
  labels: {{- include "guard.labels" . | nindent 4 }}
spec:
  selector: {{- include "guard.selector" . | nindent 4 }}
  ports:
    - {name: https, port: 443, targetPort: https}
    - {name: metrics, port: 9090, targetPort: metrics}
    {{- if .Values.api.plainHTTP }}
    - {name: http, port: {{ .Values.api.port }}, targetPort: http}
    {{- end }}
