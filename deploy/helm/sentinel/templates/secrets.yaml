{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.secretName" . }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
  annotations:
    # Must exist before the migration hook runs.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- if .Values.auth.devTokens }}
  jwtSecret: {{ required "secrets.values.jwtSecret (dev tokens enabled)" .Values.secrets.values.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.auth.signing.requireConfigured }}
  signingKeys: {{ required "secrets.values.signingKeys (scripts/gen_signing_key.py)" .Values.secrets.values.signingKeys | quote }}
  {{- else }}
  signingKeys: {{ .Values.secrets.values.signingKeys | default "" | quote }}
  {{- end }}
  oidcClientSecret: {{ .Values.secrets.values.oidcClientSecret | default "" | quote }}
  dbAppPassword: {{ required "secrets.values.dbAppPassword" .Values.secrets.values.dbAppPassword | quote }}
  dbAdminPassword: {{ required "secrets.values.dbAdminPassword" .Values.secrets.values.dbAdminPassword | quote }}
  anthropicApiKey: {{ .Values.secrets.values.anthropicApiKey | quote }}
  # LangGraph checkpoints: app role, own schema. Lives in the Secret because it embeds the password.
  checkpointDsn: "postgresql://sentinel_app:{{ .Values.secrets.values.dbAppPassword }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}?options=-csearch_path%3Dlanggraph{{ with .Values.postgres.sslmode }}&sslmode={{ . }}{{ end }}"
{{- end }}
