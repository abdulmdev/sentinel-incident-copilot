{{- if .Values.externalSecrets.enabled }}
# AWS Secrets Manager -> Kubernetes Secret. Secret values never live in Git or Helm values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade   # the migration hook needs it first
    helm.sh/hook-weight: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ .Values.externalSecrets.secretStore }} }
  target:
    name: {{ .Values.secrets.existingSecret }}
    template:
      data:
        signingKeys: "{{ "{{" }} .signingKeys {{ "}}" }}"
        oidcClientSecret: "{{ "{{" }} .oidcClientSecret {{ "}}" }}"
        dbAppPassword: "{{ "{{" }} .dbAppPassword {{ "}}" }}"
        dbAdminPassword: "{{ "{{" }} .dbAdminPassword {{ "}}" }}"
        anthropicApiKey: "{{ "{{" }} .anthropicApiKey {{ "}}" }}"
        checkpointDsn: "postgresql://sentinel_app:{{ "{{" }} .dbAppPassword {{ "}}" }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}?options=-csearch_path%3Dlanggraph&sslmode=require"
  data:
    - { secretKey: signingKeys, remoteRef: { key: {{ .Values.externalSecrets.appSecretKey }}, property: signingKeys } }
    - { secretKey: oidcClientSecret, remoteRef: { key: {{ .Values.externalSecrets.appSecretKey }}, property: oidcClientSecret } }
    - { secretKey: dbAppPassword, remoteRef: { key: {{ .Values.externalSecrets.appSecretKey }}, property: dbAppPassword } }
    - { secretKey: anthropicApiKey, remoteRef: { key: {{ .Values.externalSecrets.appSecretKey }}, property: anthropicApiKey } }
    - { secretKey: dbAdminPassword, remoteRef: { key: {{ required "externalSecrets.dbAdminSecretKey" .Values.externalSecrets.dbAdminSecretKey }}, property: password } }
{{- end }}
