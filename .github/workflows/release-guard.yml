name: release-guard

# Tag v2.x.y[-pre] → Sentinel Guard release:
#   image   ghcr.io/<owner>/sentinel-guard:<version> (linux/amd64+arm64, SBOM + provenance, cosign-signed)
#   chart   oci://ghcr.io/<owner>/charts/sentinel-guard --version <version>
#   assets  kubectl-sentinel for 5 platforms, checksums, the krew manifest, install.yaml,
#           the Python SDK (wheel + sdist) and the TypeScript SDK (npm tarball)
# Publishing beyond GitHub is off until the repository opts in (Settings → Variables):
#   PUBLISH_PYPI=true             PyPI, by trusted publishing (no token): docs/guard/publishing.md
#   PUBLISH_NPM=true              npm, by trusted publishing, with provenance
#   ARTIFACTHUB_REPOSITORY_ID=…   the chart's Artifact Hub metadata (verified publisher)
on:
  push:
    tags: ["v2.*"]

permissions:
  contents: write   # the GitHub release
  packages: write   # image + chart on GHCR
  id-token: write   # keyless cosign signing

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REPO: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: guard/go.mod, cache-dependency-path: guard/go.sum }
      - uses: azure/setup-helm@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Version
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER/sentinel-guard" >> "$GITHUB_OUTPUT"
          echo "charts=oci://ghcr.io/$OWNER/charts" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

      - name: Tests (the release is only as good as its gate)
        working-directory: guard
        run: go vet ./... && go test -race ./...

      - name: Image (multi-arch, SBOM, provenance)
        id: image
        uses: docker/build-push-action@v6
        with:
          context: guard
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
          sbom: true
          provenance: mode=max

      - name: Sign the image (keyless, Sigstore)
        run: cosign sign --yes "${{ steps.v.outputs.image }}@${{ steps.image.outputs.digest }}"

      - name: kubectl plugin binaries
        working-directory: guard
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            out=../dist/build/$os-$arch; mkdir -p "$out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${{ steps.v.outputs.version }}" -o "$out/kubectl-sentinel$ext" ./cmd/kubectl-sentinel
            cp ../LICENSE "$out/"
            tar -C "$out" -czf "../dist/kubectl-sentinel_${os}_${arch}.tar.gz" .
          done
          cd ../dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt

      - name: Chart (OCI, signed) and install.yaml
        env: { CHARTS: "${{ steps.v.outputs.charts }}" }
        run: |
          V=${{ steps.v.outputs.version }}
          C=deploy/helm/sentinel-guard/Chart.yaml
          sed -i "s/^version: .*/version: $V/; s/^appVersion: .*/appVersion: $V/" $C
          sed -i "s|^  artifacthub.io/prerelease: .*|  artifacthub.io/prerelease: \"${{ steps.v.outputs.prerelease }}\"|" $C
          sed -i "s|image: ghcr.io/abdulmdev/sentinel-guard:.*|image: ${{ steps.v.outputs.image }}:$V|" $C
          helm package deploy/helm/sentinel-guard -d dist
          helm push dist/sentinel-guard-$V.tgz ${{ steps.v.outputs.charts }} 2>&1 | tee dist/helm-push.log
          DIGEST=$(sed -n 's/^Digest: //p' dist/helm-push.log)
          cosign sign --yes "${CHARTS#oci://}/sentinel-guard@$DIGEST" 2>&1 | tail -2
          rm dist/helm-push.log
          helm template sentinel-guard deploy/helm/sentinel-guard -n sentinel-system --include-crds \
            --set createNamespace=true --set image.repository=${{ steps.v.outputs.image }} > dist/install.yaml

      - name: Artifact Hub repository metadata
        if: vars.ARTIFACTHUB_REPOSITORY_ID != ''
        env: { CHARTS: "${{ steps.v.outputs.charts }}" }
        run: |
          curl -sSL https://github.com/oras-project/oras/releases/download/v1.2.3/oras_1.2.3_linux_amd64.tar.gz | tar -xz -C /usr/local/bin oras
          printf 'repositoryID: %s\nowners:\n  - name: %s\n' "${{ vars.ARTIFACTHUB_REPOSITORY_ID }}" "${{ github.repository_owner }}" > artifacthub-repo.yml
          oras push "${CHARTS#oci://}/sentinel-guard:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: SDK packages
        run: |
          V=${{ steps.v.outputs.version }}
          # PEP 440 for Python: 2.0.0-alpha.3 -> 2.0.0a3, -beta.1 -> b1, -rc.1 -> rc1
          PY=$(echo "$V" | sed -E 's/-alpha\.?/a/; s/-beta\.?/b/; s/-rc\.?/rc/')
          sed -i "s/^version = .*/version = \"$PY\"/" sdk/python/pyproject.toml
          (cd sdk/python && uv build --out-dir ../../dist/sdk)
          (cd sdk/typescript && npm ci && npm version --no-git-tag-version --allow-same-version "$V" && npm run build \
            && npm pack --pack-destination ../../dist/sdk)
          ls -l dist/sdk

      - uses: actions/upload-artifact@v4
        with: { name: sdk, path: dist/sdk }

      - name: krew manifest
        run: python3 scripts/krew_manifest.py "${{ steps.v.outputs.version }}" dist/checksums.txt "$REPO" > dist/sentinel.yaml

      - name: GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          PRE=""; [ "${{ steps.v.outputs.prerelease }}" = true ] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" $PRE --title "Sentinel Guard ${{ steps.v.outputs.version }}" \
            --notes-file docs/guard/release-notes.md \
            dist/kubectl-sentinel_*.tar.gz dist/checksums.txt dist/install.yaml dist/sentinel.yaml dist/sentinel-guard-*.tgz \
            dist/sdk/*

  # The SDKs on PyPI and npm, once the repository opts in (see the top of this file). Both use trusted
  # publishing: the registries trust this workflow's OIDC identity, so no token is stored anywhere.
  pypi:
    needs: release
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: sdk, path: dist }
      - run: mkdir -p py && mv dist/*.whl dist/*.tar.gz py/ && ls py
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: py }

  npm:
    needs: release
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: sdk, path: dist }
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@11
      - name: Publish (prereleases under the "next" tag)
        run: |
          TAG=latest; case "$GITHUB_REF_NAME" in *-*) TAG=next;; esac
          npm publish dist/*.tgz --access public --tag "$TAG"
