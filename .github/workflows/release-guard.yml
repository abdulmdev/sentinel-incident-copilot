name: release-guard

# Tag v2.x.y[-pre] → Sentinel Guard release:
#   image   ghcr.io/<owner>/sentinel-guard:<version> (linux/amd64+arm64, SBOM + provenance, cosign-signed)
#   chart   oci://ghcr.io/<owner>/charts/sentinel-guard --version <version>
#   assets  kubectl-sentinel for 5 platforms, checksums, the krew manifest, install.yaml
on:
  push:
    tags: ["v2.*"]

permissions:
  contents: write   # the GitHub release
  packages: write   # image + chart on GHCR
  id-token: write   # keyless cosign signing

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REPO: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: guard/go.mod, cache-dependency-path: guard/go.sum }
      - uses: azure/setup-helm@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }

      - name: Version
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER/sentinel-guard" >> "$GITHUB_OUTPUT"
          echo "charts=oci://ghcr.io/$OWNER/charts" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

      - name: Tests (the release is only as good as its gate)
        working-directory: guard
        run: go vet ./... && go test -race ./...

      - name: Image (multi-arch, SBOM, provenance)
        id: image
        uses: docker/build-push-action@v6
        with:
          context: guard
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
          sbom: true
          provenance: mode=max

      - name: Sign the image (keyless, Sigstore)
        run: cosign sign --yes "${{ steps.v.outputs.image }}@${{ steps.image.outputs.digest }}"

      - name: kubectl plugin binaries
        working-directory: guard
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            out=../dist/build/$os-$arch; mkdir -p "$out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${{ steps.v.outputs.version }}" -o "$out/kubectl-sentinel$ext" ./cmd/kubectl-sentinel
            cp ../LICENSE "$out/"
            tar -C "$out" -czf "../dist/kubectl-sentinel_${os}_${arch}.tar.gz" .
          done
          cd ../dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt

      - name: Chart (OCI) and install.yaml
        run: |
          V=${{ steps.v.outputs.version }}
          sed -i "s/^version: .*/version: $V/; s/^appVersion: .*/appVersion: $V/" deploy/helm/sentinel-guard/Chart.yaml
          helm package deploy/helm/sentinel-guard -d dist
          helm push dist/sentinel-guard-$V.tgz ${{ steps.v.outputs.charts }}
          helm template sentinel-guard deploy/helm/sentinel-guard -n sentinel-system --include-crds \
            --set createNamespace=true --set image.repository=${{ steps.v.outputs.image }} > dist/install.yaml

      - name: krew manifest
        run: python3 scripts/krew_manifest.py "${{ steps.v.outputs.version }}" dist/checksums.txt "$REPO" > dist/sentinel.yaml

      - name: GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          PRE=""; [ "${{ steps.v.outputs.prerelease }}" = true ] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" $PRE --title "Sentinel Guard ${{ steps.v.outputs.version }}" \
            --notes-file docs/guard/release-notes.md \
            dist/kubectl-sentinel_*.tar.gz dist/checksums.txt dist/install.yaml dist/sentinel.yaml dist/sentinel-guard-*.tgz
