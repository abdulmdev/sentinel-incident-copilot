# Mounted twice by compose.yaml: as Grafana's data source and as its dashboard provider.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
providers:
  - name: sentinel-guard
    folder: Sentinel Guard
    type: file
    options:
      path: /var/lib/grafana/dashboards
