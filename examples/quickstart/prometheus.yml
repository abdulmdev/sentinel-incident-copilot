# The quickstart's Prometheus (docker compose --profile monitoring up): scrapes the guard and loads
# the same alert and recording rules the Helm chart ships (deploy/helm/sentinel-guard/alerts).
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules/guard-alerts.yaml
scrape_configs:
  - job_name: sentinel-guard
    static_configs:
      - targets: ["guard:9090"]
