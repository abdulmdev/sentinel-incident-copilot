[project]
name = "safeactionbench"
version = "1.0.0"
description = "SafeActionBench: how often does an AI agent's proposed production action cause harm, with and without a guard?"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2"]
keywords = ["benchmark", "ai-agents", "safety", "sre", "incident-response", "mcp", "guardrails"]

[project.scripts]
safeactionbench = "safeactionbench.cli:main"

[project.urls]
Homepage = "https://github.com/abdulmdev/sentinel-incident-copilot/tree/main/bench"
Leaderboard = "https://abdulmdev.github.io/sentinel-incident-copilot/bench/"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["safeactionbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
